<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Radiation Monitor Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

h1 {
    color: #333;
}

.cards {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    border: 1px solid #ccc;
    padding: 12px;
    min-width: 180px;
    background: #f8f8f8;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
}

th {
    background: #eee;
}

.ok {
    color: green;
    font-weight: bold;
}

.warn {
    color: orange;
    font-weight: bold;
}

.alarm {
    color: red;
    font-weight: bold;
}

#chartContainer {
    margin-top: 25px;
    margin-bottom: 25px;
}

form {
    margin-bottom: 20px;
}

input, select, button {
    padding: 6px;
    margin-right: 5px;
}
</style>

</head>
<body>

<h1>Radiation Monitor Dashboard</h1>

<div class="cards">

<div class="card">
Всего записей<br>
<b id="totalCount">0</b>
</div>

<div class="card">
Тревог<br>
<b id="alarmCount">0</b>
</div>

<div class="card">
Последнее значение<br>
<b id="lastValue">-</b>
</div>

<div class="card">
Обновлено<br>
<b id="lastUpdate">-</b>
</div>

</div>

<form onsubmit="addMeasurement(event)">

<select id="detectorId">
    <option value="1">AirTrack-01</option>
    <option value="2">WaterTrack-01</option>
    <option value="3">Gamma-01</option>
    <option value="4">DoseRate-01</option>
</select>

<input
    id="value"
    type="number"
    step="0.001"
    placeholder="Значение"
    required>

<button type="submit">
Добавить
</button>

</form>

<button onclick="loadMeasurements()">
Обновить
</button>

<p id="status">
Загрузка...
</p>

<div id="chartContainer">
<canvas id="chart"></canvas>
</div>

<table>

<thead>
<tr>
    <th>ID</th>
    <th>Станция</th>
    <th>Детектор</th>
    <th>Значение</th>
    <th>Время</th>
    <th>Статус</th>
</tr>
</thead>

<tbody id="data">
</tbody>

</table>

<script>

let chart = null;

function getState(value) {

    if (value >= 1.0) {
        return {
            text: "ALARM",
            cls: "alarm"
        };
    }

    if (value >= 0.5) {
        return {
            text: "WARNING",
            cls: "warn"
        };
    }

    return {
        text: "OK",
        cls: "ok"
    };
}

async function addMeasurement(event) {

    event.preventDefault();

    const detectorId =
        Number(document.getElementById("detectorId").value);

    const value =
        Number(document.getElementById("value").value);

    await fetch("/api/measurements", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            detector: {
                id: detectorId
            },
            value: value
        })
    });

    document.getElementById("value").value = "";

    await loadMeasurements();
}

async function loadMeasurements() {

    const status =
        document.getElementById("status");

    const tbody =
        document.getElementById("data");

    status.textContent = "Загрузка...";

    try {

        const response =
            await fetch("/api/measurements");

        const rows =
            await response.json();

        tbody.innerHTML = "";

        let alarmCount = 0;

        rows.forEach(row => {

            const value =
                Number(row.value);

            const state =
                getState(value);

            if (state.text === "ALARM") {
                alarmCount++;
            }

            const tr =
                document.createElement("tr");

            tr.innerHTML = `
                <td>${row.id}</td>
                <td>${row.detector?.station?.name ?? ""}</td>
                <td>${row.detector?.name ?? ""}</td>
                <td>${value.toFixed(3)}</td>
                <td>${row.createdAt ?? ""}</td>
                <td class="${state.cls}">
                    ${state.text}
                </td>
            `;

            tbody.appendChild(tr);
        });

        document.getElementById("totalCount")
            .textContent = rows.length;

        document.getElementById("alarmCount")
            .textContent = alarmCount;

        document.getElementById("lastValue")
            .textContent =
                rows.length
                    ? Number(rows[0].value).toFixed(3)
                    : "-";

        document.getElementById("lastUpdate")
            .textContent =
                new Date().toLocaleTimeString();

        drawChart(rows);

        status.textContent =
            "Записей: " + rows.length;

    } catch (e) {

        console.error(e);

        status.textContent =
            "Ошибка загрузки данных";
    }
}

function drawChart(rows) {

    const chartRows =
        [...rows].reverse().slice(-30);

    const labels =
        chartRows.map(r => {

            const detector =
                r.detector?.name ?? "unknown";

            const time =
                r.createdAt
                    ? r.createdAt.substring(11,19)
                    : "#" + r.id;

            return detector + " " + time;
        });

    const values =
        chartRows.map(r =>
            Number(r.value));

    const ctx =
        document.getElementById("chart");

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Radiation",
                data: values,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

loadMeasurements();

setInterval(loadMeasurements, 5000);

</script>

</body>
</html>
