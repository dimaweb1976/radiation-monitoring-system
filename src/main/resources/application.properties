spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5433/radiation
spring.datasource.username=${DB_USER:javauser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
radiation.auth.admin-token=${RADIATION_ADMIN_TOKEN:}
radiation.auth.device-tokens=${RADIATION_DEVICE_TOKENS:}
radiation.threshold.warning=0.5
radiation.threshold.alarm=1.0
server.address=127.0.0.1
server.port=8080
